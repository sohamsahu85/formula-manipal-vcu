; Formula Manipal - APPS/BPS calibration & bring-up reader (standalone)
; ======================================================================
; A bare ADC reader for the real VCU PCB: no kernel, no CAN, no control logic.
; Its only job is to read APPS1/APPS2/BPS and report live values + running
; min/max so the true released/pressed endpoints can be captured per sensor,
; and to serve as the first bring-up check that all three analog channels read
; sanely before any control code touches them.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
