; Formula Manipal VCU - FreeRTOS build (comparison A)
;
; The control logic is NOT in this project. It lives in ../shared_libs/VcuApp
; and is compiled into both this and vcu_minios, so the two firmwares run
; byte-identical logic and a head-to-head test compares KERNELS, not programs.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_extra_dirs = ../shared_libs      ; VcuApp, DTI550, SignalFilter, DataLogger

[platformio]
description = VCU on FreeRTOS - shares control logic with vcu_minios
