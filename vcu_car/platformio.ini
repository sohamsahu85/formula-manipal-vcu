; Formula Manipal VCU - CAR firmware (the real board)
; =====================================================
; Self-contained working copy for the actual VCU PCB. Built on the Phase-3
; validated miniOS kernel (lib/miniOS), with the control logic VENDORED locally
; in lib/ (VcuApp, SignalFilter, DTI550, DataLogger) -- it deliberately does NOT
; point at ../shared_libs, so car-specific changes here (pins, dual-APPS,
; calibration, R2D/watchdog) never touch the frozen, validated vcu_minios or the
; FreeRTOS comparison build.
;
; Frozen references (do not edit): ../vcu_minios, ../vcu_freertos, ../shared_libs

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
; no lib_extra_dirs: all libraries are local to this project's lib/

[platformio]
description = Formula Manipal VCU car firmware on miniOS (self-contained)
