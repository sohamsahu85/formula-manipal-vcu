; Formula Manipal VCU - miniOS build (comparison B)
;
; Same ../shared_libs/VcuApp control logic as vcu_freertos. Only the kernel and
; the thin adapter in src/ differ -- which is what makes the comparison valid.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_extra_dirs = ../shared_libs      ; VcuApp, DTI550, SignalFilter, DataLogger

[platformio]
description = VCU on miniOS (custom kernel) - shares control logic with vcu_freertos
